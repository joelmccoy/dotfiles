unbind r
bind r source-file ~/.tmux.conf
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -g set-clipboard on

# Set prefix to C-a
set -g prefix C-a
set-option -g prefix2 C-b

# Set pane navigation to vim keys
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r h select-pane -L

# Sets m to maximize pane
bind -r m resize-pane -Z

# Mouse/copy-mode ergonomics for Ghostty
set -g mouse on
setw -g mode-keys vi
set -g history-limit 100000
# In vi copy-mode, make Escape leave copy-mode instead of only clearing selection.
bind -T copy-mode-vi Escape send-keys -X cancel

# Wheel up enters tmux copy-mode for shell scrollback, but lets full-screen apps
# like nvim handle their own mouse scrolling.
bind -T root WheelUpPane if-shell -F -t = "#{alternate_on}" \
  "send-keys -M" \
  "copy-mode -e; send-keys -X -N 1 scroll-up"
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# Set escape timeout so no delay in nvim
set-option -sg escape-time 10

# Pass extended key events through (needed for push-to-talk, etc.)
set -g extended-keys on

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# Copy mouse selections to the macOS clipboard, then return to the prompt.
# With tmux mouse mode enabled, hold Shift to use Ghostty's native selection.
set -g @yank_action 'copy-pipe-and-cancel'
set -g @yank_selection_mouse 'clipboard'

# Status bar theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_current_text "#{window_name}"
set -g @catppuccin_window_text "#{window_name}#{?window_bell_flag, 󰂞 ,}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_date_time_text "%H:%M"
# Hide session name from status bar left
set -g status-left ""

# Bell monitoring - highlight window when Claude needs input
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# Pass tmux session name to terminal (Ghostty tab title)
set -g set-titles on
set -g set-titles-string "#{session_name}"

# Make sure this is at the very bottom of tmux config
run '~/.tmux/plugins/tpm/tpm'
